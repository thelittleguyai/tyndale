[project]
name = "tyndale-runtime"
version = "0.1.0"
description = "Tyndale runtime — FastAPI monolith (Phase 1C skeleton)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "qdrant-client>=1.12",
    "jsonschema>=4.21",
    # Phase 2D walking skeleton — real Anthropic Claude + Azure Document Intelligence
    "anthropic>=0.39",
    "azure-ai-documentintelligence>=1.0",
    "azure-core>=1.30",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

# No [build-system]: this is an application project, not an installable package.
# uv manages the environment and `uv run` executes commands inside it.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
