  <!-- Footer -->
  <text x="32" y="846" fill="#6b7683" font-size="12">One row per audited RUN (#2 = a re-run; the prior verdict is kept and linked). Title + service date come from the same plausibility-gated</text>
  <text x="32" y="864" fill="#6b7683" font-size="12">source as the member's own Record row — a case with no plausible provider reads "Bill review", never a misread ledger label. No email on this page.</text>
  <text x="32" y="890" fill="#6b7683" font-size="12">Queue policy (§7-2d): 100% of completed runs, dial-able down; the five triggers always enqueue. Who claimed or decided a run sits under its state —</text>
  <text x="32" y="908" fill="#6b7683" font-size="12">there is no assignee column and no assignment machinery in Phase 1 (§7-2e). Rule candidates are Phase 2 and have no pill here yet.</text>
  <text x="32" y="936" fill="#9aa4ad" font-size="11">Mockup · Human Review queue · REGENERATED 2026-09-21 to match the shipped Phase 1 (doc 39 §1). The sketch uses the light palette; the console itself</text>
  <text x="32" y="951" fill="#9aa4ad" font-size="11">is the dark navy admin theme. Pill colours are the shipped AA pairs (&lt;ramp&gt;.deep on &lt;ramp&gt;.soft).</text>
</svg>
