server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Hashed, immutable bundles emitted by the Expo static web export.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Expo Router static export: prefer the route's prerendered .html, then fall
    # back to the SPA index so client-side / dynamic routes still resolve.
    # no-cache on HTML (the hashed JS/asset chunks above stay immutable): the
    # browser must revalidate index.html on every load so a new deploy's chunk
    # hashes are picked up immediately, instead of serving a stale HTML that
    # points at deleted chunks (which is why a hard-refresh was needed before).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
}
