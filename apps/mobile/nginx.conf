server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Behind the Container App ingress, TLS terminates upstream and nginx listens on :80.
    # With the default absolute_redirect, the index module's automatic directory redirect
    # ("/chat" -> "/chat/") emitted "Location: http://app.tyndaleapp.net/chat/" — an
    # absolute PLAIN-HTTP URL the ingress wedges on (the 2026-08-26 viewport-sweep bug:
    # /chat, /case, /audit, /intake all hung slash-less). Relative redirects keep the
    # browser on the scheme/host it arrived on, whatever sits in front of us.
    absolute_redirect off;

    # Hashed, immutable bundles emitted by the Expo static web export.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Expo Router static export: prefer the route's prerendered .html, then fall
    # back to the SPA index so client-side / dynamic routes still resolve.
    # no-cache on HTML (the hashed JS/asset chunks above stay immutable): the
    # browser must revalidate index.html on every load so a new deploy's chunk
    # hashes are picked up immediately, instead of serving a stale HTML that
    # points at deleted chunks (which is why a hard-refresh was needed before).
    location / {
        # $uri/index.html before $uri/: a directory route requested WITHOUT its trailing
        # slash ("/chat") serves its prerendered index directly — no redirect round-trip
        # at all. The $uri/ entry (now reachable only for dirs with no index.html) and
        # absolute_redirect off above are belt-and-braces for future routes.
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
}
