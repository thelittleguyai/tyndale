name: deploy-web-marketing

# Builds the Next.js marketing image from apps/web-marketing/Dockerfile (context
# is repo root so workspace deps resolve), pushes it to GHCR, and rolls the
# dev marketing Container App to the new image.
#
# Triggers:
#   - push to main touching apps/web-marketing/** or packages/shared/** or this workflow
#   - manual workflow_dispatch
#
# Auth:
#   - GHCR push: built-in GITHUB_TOKEN with packages:write
#   - Azure: OIDC federation via env-scoped secrets AZURE_CLIENT_ID / TENANT_ID /
#     SUBSCRIPTION_ID (created by infra/setup-github-deploy.sh)
#
# Rollback:
#   az containerapp update --name tyndale-dev-marketing \
#     --resource-group tyndale-dev-rg \
#     --image ghcr.io/.../web-marketing:<previous-sha>

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-marketing/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web-marketing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-marketing
  cancel-in-progress: false

permissions:
  contents: read
  packages: write  # GHCR push
  id-token: write  # Azure OIDC

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tyndale/web-marketing
  CONTAINER_APP: tyndale-dev-marketing
  RESOURCE_GROUP: tyndale-dev-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev   # scopes OIDC subject to repo:OWNER/REPO:environment:dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push marketing image
        uses: docker/build-push-action@v6
        with:
          context: .                                # repo root — workspace deps live up here
          file: apps/web-marketing/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --output none
          echo "Updated $CONTAINER_APP -> $IMAGE:${{ github.sha }}"

      - name: Show recent revisions
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([], &properties.createdTime)[-3:].{name:name, active:properties.active, replicas:properties.replicas, image:properties.template.containers[0].image, created:properties.createdTime}" \
            -o table
