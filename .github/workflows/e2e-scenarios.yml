name: E2E Scenarios (dev, on-demand)

# HP-2: drives the deployed DEV API through the synthetic bill-scenario suite (upload ->
# extraction -> encounter -> audit -> terminal), asserting the honest terminal state + expected
# finding types + no fixture leakage.
#
# workflow_dispatch ONLY — NOT scheduled: each run costs real Claude tokens on dev (~1 audit per
# scenario; 12 scenarios ≈ a dozen multi-minute agent runs). Trigger it manually when validating
# a change end-to-end. Uses SYNTHETIC identities only (never real PHI).
#
# Auth to the dev-only /v1/admin/test-token endpoint (which mints the synthetic test user's
# session) uses ONE of:
#   * E2E_TEST_SECRET (preferred) — the stable Key Vault shared secret; set once from
#     `terraform output -raw e2e_test_token_secret`. Never expires.
#   * E2E_ADMIN_TOKEN (fallback) — an admin session token (a 7-day JWT; needs periodic refresh).

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated scenario names to run (blank = all 12)'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    working-directory: runtime

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (incl. the harness dev group)
        run: uv sync --frozen
      - name: Run scenarios against dev
        env:
          # Prefer the stable Key Vault shared secret (set once via `terraform output`);
          # E2E_ADMIN_TOKEN is a fallback (a 7-day admin session token).
          TYNDALE_E2E_SECRET: ${{ secrets.E2E_TEST_SECRET }}
          TYNDALE_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
        run: |
          ONLY_ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            for s in $(echo "${{ inputs.only }}" | tr ',' ' '); do
              ONLY_ARGS="$ONLY_ARGS --only $s"
            done
          fi
          uv run python scripts/e2e_scenarios/run_scenarios.py --dev $ONLY_ARGS
