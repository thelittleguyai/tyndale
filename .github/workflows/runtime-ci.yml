name: Runtime CI

# CO-16: the runtime (FastAPI/Python) had NO CI gate — only the Docker-build
# deploys, which run `alembic upgrade head` against the LIVE dev DB. A broken
# migration chain or a model/migration drift would only surface at deploy time.
#
# This adds a pre-merge gate on runtime/** :
#   - tests:      the full pytest suite + ruff lint, against a fresh Postgres.
#   - migrations: `alembic upgrade head` on an EMPTY DB (proves the chain applies
#                 from scratch) + `alembic check` (proves the SQLAlchemy models
#                 match the migrations — no schema drift). DL-77.

# Audit 2026-08-27 item 3: runtime/tests holds REPO-WIDE guards (design-token scans over
# apps/*, flag/env wiring over infra/, script drift over docs/build-kit) — but the triggers
# only watched runtime/**, so a change in any scanned tree skipped the guards entirely.
# Triggers EXTENDED rather than splitting the guards into their own workflow: the guards
# share the suite's uv + Postgres harness, and a second copy of that setup would drift.
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'docs/build-kit/**'
      - 'intelligence-layer/**'
      - '.github/workflows/runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'docs/build-kit/**'
      - 'intelligence-layer/**'
      - '.github/workflows/runtime-ci.yml'
  # Reusable (audit item 3): deploy-runtime gates on this exact suite instead of racing it.
  workflow_call:
    inputs:
      gate:
        description: 'Called as a deploy gate — never skip (see the scope job)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: runtime

jobs:
  # ONE SUITE PER PUSH (deep review 2/3). A push that touches runtime/** fired this workflow
  # AND deploy-runtime, which calls this workflow as its gate — the same 3-minute suite, twice.
  # On a push, the standalone run now steps aside when the push touches deploy-runtime's paths
  # (DEPLOY_PATHS below mirrors its `on.push.paths`; test_ci_workflow_parity.py keeps them in
  # step). Pull requests always run; the gate call always runs; if the changed-file lookup
  # fails, it RUNS — skipping is the only thing that needs certainty.
  scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ inputs.gate }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEPLOY_PATHS: '^(runtime/|packages/shared/|\.github/workflows/deploy-runtime\.yml$)'
        run: |
          run=true
          if [ "$GATE" != "true" ] && [ "$EVENT" = "push" ]; then
            files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" \
              --jq '.files[].filename' 2>/dev/null || echo "__lookup_failed__")
            if echo "$files" | grep -qE "$DEPLOY_PATHS"; then
              run=false
              echo "::notice title=Runtime CI skipped::this push touches deploy-runtime's paths — Deploy Dev Runtime runs this same suite as its gate."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  tests:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tyndale
          POSTGRES_PASSWORD: tyndale
          POSTGRES_DB: tyndale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyndale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each job gets its own fresh Postgres service, so the chat-message rate
      # limit can't accumulate across runs (the local-DB flake). conftest fills
      # the other test env vars (NODE_ENV, RATE_LIMIT_ENABLED, ALLOW_FIXTURE_FALLBACK).
      DATABASE_URL: postgresql+asyncpg://tyndale:tyndale@localhost:5432/tyndale
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q

  migrations:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tyndale
          POSTGRES_PASSWORD: tyndale
          POSTGRES_DB: tyndale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyndale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://tyndale:tyndale@localhost:5432/tyndale
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # Migration 0001 creates the pgcrypto extension itself, so upgrade head is
      # self-contained on an empty database.
      - name: Alembic upgrade head (fresh DB — chain applies from scratch)
        run: uv run alembic upgrade head
      - name: Alembic check (models match migrations — no drift)
        run: uv run alembic check
