name: Deploy Dev Runtime

# Builds the FastAPI runtime image from runtime/Dockerfile, pushes it to GHCR,
# then rolls the dev Container App to the new SHA-tagged image.
#
# Triggers:
#   - push to main touching runtime/** or packages/shared/** or this workflow
#   - manual workflow_dispatch (always allowed on main)
#
# Auth:
#   - GHCR push: built-in GITHUB_TOKEN with packages:write
#   - Azure: OIDC federation via secrets.AZURE_CLIENT_ID / TENANT_ID / SUBSCRIPTION_ID
#     (created by infra/setup-github-deploy.sh)
#
# Rollback: `az containerapp update --image ghcr.io/.../runtime:<previous-sha>`
# or via the Azure portal's revision list.

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-runtime.yml'
  workflow_dispatch:

concurrency:
  group: deploy-runtime
  cancel-in-progress: false

permissions:
  contents: read
  packages: write  # GHCR push
  id-token: write  # Azure OIDC

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tyndale/runtime
  CONTAINER_APP: tyndale-dev-runtime
  MIGRATION_JOB: tyndale-dev-runtime-migrations
  RESOURCE_GROUP: tyndale-dev-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev   # scopes secrets to the GitHub `dev` environment and makes
                       # the OIDC subject claim repo:OWNER/REPO:environment:dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime loads agent/chat system prompts (and the Qdrant fixtures) from
      # intelligence-layer/ at runtime. The build context is ./runtime, so stage a
      # copy in first; the Dockerfile's `COPY . .` then lands it at
      # /app/intelligence-layer (surfaced via TYNDALE_INTELLIGENCE_LAYER_ROOT).
      - name: Stage intelligence-layer into the build context
        run: cp -r intelligence-layer runtime/intelligence-layer

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ─── Run migrations FIRST (Alembic + dev seed) ──────────────────────
      # The migration job lives in the same internal CAE as the runtime so it
      # can reach the VNet-only Postgres. We:
      #   1. point the job at the new image SHA,
      #   2. start a manual execution,
      #   3. poll for completion (success / failure / timeout),
      #   4. surface the job logs on failure, and FAIL the workflow so the
      #      runtime CA never rolls to a code version whose migrations didn't
      #      land.
      - name: Update migrations job image
        run: |
          az containerapp job update \
            --name "$MIGRATION_JOB" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --output none
          echo "Updated $MIGRATION_JOB image -> $IMAGE:${{ github.sha }}"

      - name: Run migrations
        id: migrate
        run: |
          set -euo pipefail
          # `az containerapp job start` returns the execution object; its
          # `.name` is the execution name. If that ever comes back empty
          # (CLI return-shape drift), fall back to the most-recent execution.
          EXECUTION=$(az containerapp job start \
            --name "$MIGRATION_JOB" \
            --resource-group "$RESOURCE_GROUP" \
            --query "name" -o tsv 2>/dev/null || true)
          if [ -z "$EXECUTION" ]; then
            sleep 3
            EXECUTION=$(az containerapp job execution list \
              --name "$MIGRATION_JOB" \
              --resource-group "$RESOURCE_GROUP" \
              --query "sort_by([], &properties.startTime)[-1].name" -o tsv)
          fi
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
          echo "Started execution: $EXECUTION"

          # Poll every 5s, up to 5 minutes.
          # CLI flags: --name is the JOB name, --job-execution-name is the
          # execution. (The earlier --job-name/--name combo errored every
          # iteration and the fallback masked it as a permanent 'Pending'.)
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution show \
              --name "$MIGRATION_JOB" \
              --job-execution-name "$EXECUTION" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "[$i/60] status=$STATUS"
            case "$STATUS" in
              Succeeded)
                echo "Migrations succeeded."
                exit 0
                ;;
              Failed|Stopped|Degraded)
                echo "Migrations $STATUS — see logs below."
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Migration job did not complete within 5 minutes."
          exit 1

      - name: Show migration logs (on failure)
        if: failure() && steps.migrate.outputs.execution != ''
        run: |
          az containerapp job execution show \
            --name "$MIGRATION_JOB" \
            --job-execution-name "${{ steps.migrate.outputs.execution }}" \
            --resource-group "$RESOURCE_GROUP" \
            -o yaml || true
          # Best-effort recent logs via Log Analytics (90s window).
          WORKSPACE=$(az containerapp env show \
            --name tyndale-dev-cae \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId" -o tsv 2>/dev/null || true)
          if [ -n "$WORKSPACE" ]; then
            az monitor log-analytics query \
              --workspace "$WORKSPACE" \
              --analytics-query "ContainerAppConsoleLogs_CL | where ContainerJobName_s == '$MIGRATION_JOB' | order by TimeGenerated desc | take 200 | project TimeGenerated, Log_s" \
              -o table || true
          fi

      # ─── THEN roll the runtime CA to the new image ───────────────────────
      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --output none
          echo "Updated $CONTAINER_APP -> $IMAGE:${{ github.sha }}"

      # ─── Roll the scheduled cron jobs (Phase 3.2) to the new image ───────
      # They run `python -m app.crons <name>` on their cron schedule; no need to
      # start or wait — just point them at the new SHA for their next run.
      - name: Update cron job images
        run: |
          for job in $(az containerapp job list --resource-group "$RESOURCE_GROUP" \
              --query "[?starts_with(name, '${CONTAINER_APP}-cron-') || starts_with(name, 'tyndale-dev-cron-')].name" -o tsv); do
            az containerapp job update --name "$job" --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE:${{ github.sha }}" --output none
            echo "Rolled $job -> $IMAGE:${{ github.sha }}"
          done

      - name: Show recent revisions
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([], &properties.createdTime)[-3:].{name:name, active:properties.active, replicas:properties.replicas, image:properties.template.containers[0].image, created:properties.createdTime}" \
            -o table
