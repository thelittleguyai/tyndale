name: Deploy Dev App

# Builds the Expo static web export (apps/mobile/Dockerfile, context = repo root
# so workspace deps resolve), pushes it to GHCR, and rolls the dev product app
# Container App (app.tyndaleapp.net) to the new image.
#
# Triggers:
#   - push to main touching apps/mobile/** or packages/shared/** or this workflow
#   - manual workflow_dispatch
#
# Auth:
#   - GHCR push: built-in GITHUB_TOKEN with packages:write
#   - Azure: OIDC federation via env-scoped secrets AZURE_CLIENT_ID / TENANT_ID /
#     SUBSCRIPTION_ID
#
# Rollback:
#   az containerapp update --name tyndale-dev-app --resource-group tyndale-dev-rg \
#     --image ghcr.io/.../app:<previous-sha>

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read
  packages: write  # GHCR push
  id-token: write  # Azure OIDC

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tyndale/app
  CONTAINER_APP: tyndale-dev-app
  RESOURCE_GROUP: tyndale-dev-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev   # scopes OIDC subject to repo:OWNER/REPO:environment:dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .                                # repo root — workspace deps live up here
          file: apps/mobile/Dockerfile
          push: true
          # EXPO_PUBLIC_* is inlined into the bundle at export time, so the API
          # base URL must be a build-arg (not a Container App env var).
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=https://api.tyndaleapp.net
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --output none
          echo "Updated $CONTAINER_APP -> $IMAGE:${{ github.sha }}"

      - name: Show recent revisions
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([], &properties.createdTime)[-3:].{name:name, active:properties.active, replicas:properties.replicas, image:properties.template.containers[0].image, created:properties.createdTime}" \
            -o table

      # Audit 2026-08-27 item 3: the route matrix (written for the /chat slash-less hang)
      # now runs against the LIVE host after every roll. Routes are enumerated from the
      # exact dist the image serves — extracted from the image we just pushed.
      - name: Route matrix against the deployed host
        run: |
          docker create --name dist-probe "$IMAGE:${{ github.sha }}"
          docker cp dist-probe:/usr/share/nginx/html ./dist-deployed
          docker rm dist-probe
          # Bounded readiness (deep review 2/3) instead of `sleep 30`: `az containerapp update`
          # returns 30–60 s before the new revision takes traffic, and the matrix used to run
          # into that cutover. Wait — up to 120 s, every 5 s — until the revision built from
          # THIS image is active at 100% traffic and running, AND `/` answers 200.
          ready=""
          for i in $(seq 1 24); do
            serving=$(az containerapp revision list \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --query "length([?properties.template.containers[0].image=='$IMAGE:${{ github.sha }}' && properties.active && properties.trafficWeight==\`100\` && starts_with(properties.runningState, 'Running')])" \
              -o tsv 2>/dev/null || echo 0)
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' https://app.tyndaleapp.net/ || echo 000)
            echo "[$i/24] new revision serving=$serving  GET / -> $code"
            if [ "${serving:-0}" -ge 1 ] && [ "$code" = "200" ]; then ready=yes; break; fi
            sleep 5
          done
          if [ -z "$ready" ]; then
            echo "::error::the new revision was not serving / after 120 s — not running the route matrix against the old one"
            exit 1
          fi
          # One retry: a single transient 5xx on one of ~47 routes must not fail a good deploy.
          node apps/mobile/scripts/check-route-matrix.mjs https://app.tyndaleapp.net ./dist-deployed || {
            echo "route matrix failed — retrying once in 20 s"
            sleep 20
            node apps/mobile/scripts/check-route-matrix.mjs https://app.tyndaleapp.net ./dist-deployed
          }
